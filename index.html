<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Ranker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
            resize: vertical;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        pre {
            background: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>AI Resume Ranker</h1>
    <p>Paste the job description below:</p>
    <textarea id="job-desc" placeholder="Enter job description here..."></textarea>
    <button onclick="getResume()">Generate Resume</button>

    <pre id="output"></pre>

    <script>
        async function getResume() {
            const jobDesc = document.getElementById("job-desc").value;
            if (!jobDesc) {
                alert("Please enter a job description!");
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:8000/rank", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        job_description: jobDesc,
                        top_k: 5,
                        alpha: 0.7
                    }),
                });

                if (!response.ok) throw new Error(response.statusText);

                const data = await response.json();
                document.getElementById("output").innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                console.error(err);
                alert("Error fetching ranked resumes. Check console for details.");
            }
        }
    </script>
</body>
</html>
